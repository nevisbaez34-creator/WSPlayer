# .github/workflows/build.yml
name: Build WSPlayer

on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller pywebview requests
      - run: pyinstaller --onefile --windowed --name WSPlayer wsplayer.py
      - uses: actions/upload-artifact@v4
        with: { name: WSPlayer-Windows, path: dist/WSPlayer.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller pywebview requests
      - run: pyinstaller --onefile --windowed --name WSPlayer wsplayer.py
      - uses: actions/upload-artifact@v4
        with: { name: WSPlayer-macOS, path: dist/WSPlayer }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: pip install pyinstaller pywebview requests
      - run: pyinstaller --onefile --name WSPlayer wsplayer.py
      - uses: actions/upload-artifact@v4
        with: { name: WSPlayer-Linux, path: dist/WSPlayer }
