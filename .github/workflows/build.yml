name: Build WSPlayer

on: [push, workflow_dispatch]

jobs:

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pyinstaller pywebview requests

      - name: Compilar
        run: pyinstaller --onefile --windowed --name WSPlayer wsplayer.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: WSPlayer-Windows
          path: dist/WSPlayer.exe

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pyinstaller pywebview requests

      - name: Compilar
        run: |
          pyinstaller --windowed --name WSPlayer wsplayer.py
          cd dist
          zip -r WSPlayer-macOS.zip WSPlayer.app

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: WSPlayer-macOS
          path: dist/WSPlayer-macOS.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            patchelf \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Instalar dependencias de Python
        run: pip install pyinstaller pywebview requests

      - name: Compilar
        run: |
          pyinstaller --onefile --name WSPlayer \
            --hidden-import gi \
            --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.WebKit2 \
            wsplayer.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: WSPlayer-Linux
          path: dist/WSPlayer
